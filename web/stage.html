<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点歌机 · 歌词页</title>
<style>
  :root { --pink: #FB7299; --bg: #0f1115; --sub: #9aa0ab; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: #e8e9ec;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* 歌词页：半透明叠加层，只显示歌词（像 QQ音乐网页版），背景透出 OBS 场景 */
  body.transparent { background: transparent; }
  body.transparent .wrap { background: transparent; box-shadow: none; border-radius: 0; }

  .wrap {
    width: 100%; height: 100%;
    padding: 24px 28px;
    background: transparent;
    display: flex; flex-direction: column;
  }

  .lyric-viewport {
    flex: 1; margin-top: 8px; overflow: hidden; position: relative;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%);
  }
  .lyric-track { transition: transform .5s cubic-bezier(.22,.61,.36,1); }
  .line {
    height: 32px; line-height: 32px; text-align: center;
    font-size: 15px; color: #aab0ba; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 6px rgba(0,0,0,.75);
    transition: color .3s, font-size .3s, opacity .3s;
    opacity: .5;
  }
  .line.active { color: #fff; font-size: 22px; font-weight: 600; opacity: 1; text-shadow: 0 2px 12px rgba(0,0,0,.85); }
  .line.next { color: #dfe2e7; font-size: 17px; opacity: .8; text-shadow: 0 1px 6px rgba(0,0,0,.75); }

  .msg { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 14px; text-align: center; padding: 0 16px; text-shadow: 0 1px 6px rgba(0,0,0,.75); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lyric-viewport" id="viewport">
    <div class="lyric-track" id="track"></div>
  </div>
  <div class="msg" id="msg">等待点歌后歌词将在此滚动</div>
</div>

<script>
(function () {
  // 歌词页默认半透明（OBS 叠加层）
  document.body.classList.add("transparent");

  var LINE_H = 32;
  var viewport = document.getElementById("viewport");
  var track = document.getElementById("track");
  var msg = document.getElementById("msg");

  var curKey = "";
  var lines = [];
  var activeIdx = -1;
  var loaded = false;

  function showMsg(text) {
    msg.style.display = "flex";
    msg.textContent = text || "";
    track.innerHTML = "";
    lines = [];
    activeIdx = -1;
    loaded = false;
  }

  function renderLyric(data) {
    loaded = true;
    var lns = (data && data.lines) || [];
    if (!data || data.ok === false) {
      showMsg((data && data.msg) || "歌词加载失败");
      return;
    }
    if (!lns.length) {
      showMsg(data.msg || "暂无歌词");
      return;
    }
    msg.style.display = "none";
    lines = lns;
    track.innerHTML = "";
    lns.forEach(function (l, i) {
      var d = document.createElement("div");
      d.className = "line";
      d.textContent = l.text;
      d.setAttribute("data-i", i);
      track.appendChild(d);
    });
    activeIdx = -1;
  }

  function fetchLyric(cur) {
    showMsg("歌词加载中…");
    var url = "/api/lyric?source=" + encodeURIComponent(cur.source || "") + "&id=" + encodeURIComponent(cur.id || "");
    fetch(url).then(function (r) { return r.json(); }).then(renderLyric).catch(function () {
      showMsg("歌词加载失败");
    });
  }

  function updateActive(progress) {
    if (!loaded || !lines.length) return;
    var idx = -1;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].t <= progress) idx = i; else break;
    }
    if (idx === activeIdx) return;
    activeIdx = idx;
    var nodes = track.children;
    for (var j = 0; j < nodes.length; j++) {
      nodes[j].classList.toggle("active", j === idx);
      nodes[j].classList.toggle("next", j === idx + 1);
    }
    // 当前句与下一句整体居中（两行中间）
    var vh = viewport.clientHeight;
    var center = idx + 0.5;
    var offset = vh / 2 - LINE_H * center;
    track.style.transform = "translateY(" + offset + "px)";
  }

  function render(st) {
    var cur = st && st.current;
    if (!cur) {
      curKey = "";
      showMsg("等待点歌后歌词将在此滚动");
      return;
    }
    var key = (cur.source || "") + ":" + (cur.id || "");
    if (key !== curKey) {
      curKey = key;
      fetchLyric(cur);
    }
    updateActive(cur.progress || 0);
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws = new WebSocket(proto + location.host + "/ws");
    ws.onmessage = function (ev) {
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === "state") render(msg.data);
      } catch (e) {}
    };
    ws.onclose = function () { setTimeout(connect, 2000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
